# Développement et auto-hébergement. Les secrets viennent du fichier .env (non versionné).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cortege
      POSTGRES_USER: cortege
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortege -d cortege"]
      interval: 5s
      retries: 20
    # Port exposé en local uniquement (développement, sauvegardes).
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_PANORAMAX_URL: ${VITE_PANORAMAX_URL:-}
        VITE_SATELLITE_URL: ${VITE_SATELLITE_URL:-}
        VITE_SATELLITE_ATTRIBUTION: ${VITE_SATELLITE_ATTRIBUTION:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cortege:${POSTGRES_PASSWORD}@db:5432/cortege
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-cortege-coordination}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:3000:3000"

  # Sauvegarde quotidienne de la base (pg_dump) vers le dossier hôte BACKUP_PATH (.env).
  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: cortege
      PGDATABASE: cortege
      PGPASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      # Heure de la sauvegarde (format cron) et rétention en jours.
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      # Dossier de sauvegarde sur la machine hôte (à définir dans .env).
      - ${BACKUP_PATH:?définir BACKUP_PATH dans .env}:/backups
    # crond (busybox) ne transmet pas l'environnement : on l'enregistre pour le script, puis on programme la tâche.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printenv | grep -E '^(PG|BACKUP_KEEP_DAYS)' > /etc/cortege-backup.env
        echo "$$BACKUP_CRON /usr/local/bin/backup.sh >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "Sauvegardes programmées ($$BACKUP_CRON) vers /backups, rétention $${BACKUP_KEEP_DAYS} jours."
        exec crond -f -l 8
    restart: unless-stopped

volumes:
  db-data:
